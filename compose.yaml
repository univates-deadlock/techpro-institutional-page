services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/pages/home.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  deadlock_edge:
    external: true
    name: deadlock_edge
