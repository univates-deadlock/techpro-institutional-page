services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default: {}
      deadlock_edge:
        aliases:
          - techpro-site
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/pages/home.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  deadlock_edge:
    external: true
    name: deadlock_edge
